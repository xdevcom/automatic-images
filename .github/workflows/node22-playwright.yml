name: Build Node22 Playwright

on:
  push:
    branches:
      - main
    paths:
      - "node22-playwright/**"
      - ".github/workflows/node22-playwright.yml"
      - "README.md"
      - ".gitignore"

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./node22-playwright
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/node22-playwright:latest
            ghcr.io/${{ github.repository_owner }}/node22-playwright:1.62
